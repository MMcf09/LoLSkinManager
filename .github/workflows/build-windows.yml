name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LoLSkinManager.sln

      - name: Publish win-x64
        run: dotnet publish src/LoLSkinManager.App/LoLSkinManager.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LoLSkinManager-win-x64
          path: artifacts/win-x64/**
